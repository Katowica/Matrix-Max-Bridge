services:
  bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    # Allow the bridge to drain in-flight media/DB transactions on stop.
    stop_grace_period: 15s
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
